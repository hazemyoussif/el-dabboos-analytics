services:
  postgres:
    image: postgres:18.6
    shm_size: ${MART_POSTGRES_SHM_SIZE:-1073741824}
    environment:
      POSTGRES_USER: foundation_test
      POSTGRES_PASSWORD: foundation_test_only
      POSTGRES_DB: foundation_test
    ports:
      - '127.0.0.1:55436:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foundation_test -d foundation_test']
      interval: 2s
      timeout: 3s
      retries: 30
