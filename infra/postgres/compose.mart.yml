# Company server: its existing sdb tablespaces also require the protected storage override.
# See docs/integration/odoo-standard-api.md before recreating that PostgreSQL container.
name: dabboos-analytics-mart
services:
  postgres:
    image: postgres:18.6
    shm_size: ${MART_POSTGRES_SHM_SIZE:-1073741824}
    restart: unless-stopped
    environment:
      POSTGRES_USER: mart_bootstrap
      POSTGRES_PASSWORD: ${MART_LOCAL_ADMIN_PASSWORD:?Configure local bootstrap password}
      POSTGRES_DB: el_dabboos_analytics
    ports:
      - '127.0.0.1:55437:5432'
    volumes:
      - dabboos_analytics_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mart_bootstrap -d el_dabboos_analytics']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dabboos_analytics_data:
    name: dabboos_analytics_data
# This persistent server also hosts el_dabboos_control after `pnpm control bootstrap-local`.
# Do not add initdb hooks: existing volumes do not rerun them. Never reset this volume.
# The disposable test server remains separately configured on port 55436.
