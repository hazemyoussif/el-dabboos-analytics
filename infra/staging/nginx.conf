pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    # Match the local provider deadline plus bounded analytics/persistence work.
    location /api/ai-analyst/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_read_timeout 300s; }
    location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; }
    location /health { proxy_pass http://api:3001; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
