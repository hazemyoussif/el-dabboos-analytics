name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: foundation_test
          POSTGRES_PASSWORD: foundation_test_only
          POSTGRES_DB: foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation_test -d foundation_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PG_TEST_ADMIN_URL: postgres://foundation_test:foundation_test_only@127.0.0.1:5432/foundation_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:postgres
      - run: pnpm run build
